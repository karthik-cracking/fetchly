[package]
name = "fetchly-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fetchly Download Manager"
default-run = "fetchly"

[[bin]]
name = "fetchly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
fetchly-core = { workspace = true }
fetchly-native-host = { path = "../../crates/fetchly-native-host" }
fetchly-torrent = { path = "../../crates/fetchly-torrent" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.6"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
window-vibrancy = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
url = { workspace = true }
arboard = { version = "3.6", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }
